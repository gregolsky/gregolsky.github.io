<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 864" width="800" height="864" font-family="Space Grotesk, Helvetica, Arial, sans-serif">
<title>When Claude is involved in the Auchan shopping harness</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E9AAE"/></marker></defs>
<rect width="800" height="864" fill="#1C1B26"/>
<rect x="12" y="20" width="246" height="830" fill="#3B4355" fill-opacity="0.18" rx="6"/>
<text x="135" y="50" fill="#E8ECF1" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">YOU</text>
<rect x="277" y="20" width="246" height="830" fill="#3B4355" fill-opacity="0.18" rx="6"/>
<text x="400" y="50" fill="#E8ECF1" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">PLAIN CODE</text>
<rect x="542" y="20" width="246" height="830" fill="#3B4355" fill-opacity="0.18" rx="6"/>
<text x="665" y="50" fill="#E8B26A" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">CLAUDE</text>
<text x="665" y="68" fill="#8E9AAE" font-size="11" text-anchor="middle">no tools, JSON answers only</text>
<path d="M135 138V151.0H665V162" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M665 218V231.0H400V242" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M400 298V311.0H665V322" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M665 378V391.0H400V402" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M400 458V471.0H135V482" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M135 538V562" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M135 618V631.0H400V642" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M400 698V711.0H135V722" fill="none" stroke="#8E9AAE" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M558.0 191.0H511.0" stroke="#8E9AAE" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a)"/>
<path d="M242.0 511.0H554.0" stroke="#E8B26A" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="28.0" y="84" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8ECF1" stroke-width="1.5"/>
<text x="135.0" y="107" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Paste the list</text>
<text x="135.0" y="125" fill="#8E9AAE" font-size="11.5" text-anchor="middle">mleko 2, chleb, ser żółty…</text>
<rect x="558.0" y="164" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8B26A" stroke-width="1.5"/>
<text x="665.0" y="187" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Read the list</text>
<text x="665.0" y="205" fill="#8E9AAE" font-size="11.5" text-anchor="middle">text → items to add</text>
<rect x="293.0" y="164" width="214" height="54" rx="4" fill="#1C1B26" stroke="#8E9AAE" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="400.0" y="187" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">No Claude? Simple parser</text>
<text x="400.0" y="205" fill="#8E9AAE" font-size="11.5" text-anchor="middle">one item per line</text>
<rect x="293.0" y="244" width="214" height="54" rx="4" fill="#1C1B26" stroke="#8E9AAE" stroke-width="1.5"/>
<text x="400.0" y="267" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Draft the basket</text>
<text x="400.0" y="285" fill="#8E9AAE" font-size="11.5" text-anchor="middle">past orders, promotions, rules</text>
<rect x="558.0" y="324" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8B26A" stroke-width="1.5"/>
<text x="665.0" y="347" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Pick products or ask</text>
<text x="665.0" y="365" fill="#8E9AAE" font-size="11.5" text-anchor="middle">only from the listed candidates</text>
<rect x="293.0" y="324" width="214" height="54" rx="4" fill="#1C1B26" stroke="#8E9AAE" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="400.0" y="347" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">No Claude? Ask me</text>
<text x="400.0" y="365" fill="#8E9AAE" font-size="11.5" text-anchor="middle">about every doubtful line</text>
<rect x="293.0" y="404" width="214" height="54" rx="4" fill="#1C1B26" stroke="#8E9AAE" stroke-width="1.5"/>
<text x="400.0" y="427" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Check every operation</text>
<text x="400.0" y="445" fill="#8E9AAE" font-size="11.5" text-anchor="middle">hold changes as a proposal</text>
<rect x="28.0" y="484" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8ECF1" stroke-width="1.5"/>
<text x="135.0" y="507" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Answer, accept or ask</text>
<text x="135.0" y="525" fill="#8E9AAE" font-size="11.5" text-anchor="middle">“Powiedz, co zmienić”</text>
<rect x="558.0" y="484" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8B26A" stroke-width="1.5"/>
<text x="665.0" y="507" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Request → proposal</text>
<text x="665.0" y="525" fill="#8E9AAE" font-size="11.5" text-anchor="middle">no Claude: use the line buttons</text>
<rect x="28.0" y="564" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8ECF1" stroke-width="1.5"/>
<text x="135.0" y="587" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Approve the basket</text>
<text x="135.0" y="605" fill="#8E9AAE" font-size="11.5" text-anchor="middle">nothing is added before this</text>
<rect x="293.0" y="644" width="214" height="54" rx="4" fill="#1C1B26" stroke="#8E9AAE" stroke-width="1.5"/>
<text x="400.0" y="667" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Fill the cart over HTTP</text>
<text x="400.0" y="685" fill="#8E9AAE" font-size="11.5" text-anchor="middle">allowlisted paths, add only</text>
<rect x="28.0" y="724" width="214" height="54" rx="4" fill="#1C1B26" stroke="#E8ECF1" stroke-width="1.5"/>
<text x="135.0" y="747" fill="#E8ECF1" font-size="14" font-weight="600" text-anchor="middle">Check the cart and pay</text>
<text x="135.0" y="765" fill="#8E9AAE" font-size="11.5" text-anchor="middle">on Auchan, by hand</text>
<text x="665" y="668" fill="#8E9AAE" font-size="12" font-style="italic" text-anchor="middle">no Claude from here on</text>
<text x="400" y="748" fill="#8E9AAE" font-size="12" font-style="italic" text-anchor="middle">payment pages aren’t</text>
<text x="400" y="764" fill="#8E9AAE" font-size="12" font-style="italic" text-anchor="middle">on the allowlist</text>
<path d="M558.0 351.0H511.0" stroke="#8E9AAE" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="250" y="824" width="28" height="14" rx="3" fill="none" stroke="#8E9AAE" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="288" y="835" fill="#8E9AAE" font-size="12.5">dashed: what happens when Claude is unavailable</text>
</svg>